# Refresh Standby Radar's route history from public DOT data once a month.
name: Route history
on:
  schedule:
    - cron: "17 14 3 * *"   # the 3rd of each month
  workflow_dispatch:
  push:
    paths:
      - tools/make-routes.py
      - .github/workflows/routes.yml
permissions:
  contents: write
jobs:
  routes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/make-routes.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- play/standby/data; then echo "No change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add play/standby/data
          git commit -m "Refresh standby route history"
          git push
